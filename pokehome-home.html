<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Pokehome Tracker</title>
    <!-- font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
          rel="stylesheet">
    <!-- stylesheet -->
    <link rel="stylesheet" href="pokehome-home.css"/>
</head>

<body>
<div class="main">
    <!-- header -->
    <div class="header">
    
        <div class="header-left">
            <!-- logo / site link -->
            <a href="" class="headerLogo">PokeHome Tracker</a>

            <!-- progress -->
            <h2>Dex Progress: <span class="totalProgress">0</span> / 1394</h2>
        </div>

        <div class="header-right">
            <!-- jump dropdown -->
            <a href="#default" class="headerJump">Jump to Region</a>
            <div id="headerDropdown" class="jumpLinks">
                <h3><a href="#Kanto">Kanto</a></h3>
                <h3><a href="#Johto">Johto</a></h3>
                <h3><a href="#Hoenn">Hoenn</a></h3>
                <h3><a href="#Sinnoh">Sinnoh</a></h3>
                <h3><a href="#Unova">Unova</a></h3>
                <h3><a href="#Kalos">Kalos</a></h3>
                <h3><a href="#Alola">Alola</a></h3>
                <h3><a href="#Galar">Galar</a></h3>
                <h3><a href="#Paldea">Paldea</a></h3>
            </div>

            <!-- top link -->
            <a href="#top" class="headerTop">Back to Top</a>

            <!-- profile link -->
            <a href="#" class="headerProfile">Profile</a>
        </div>
    </div>

    <div class="searchArea">
        <input type="text" class="searchBar" placeholder="Enter Pokemon Name" />
        <button type="submit" class="searchSubmit">Search</button>
    </div>

    <div class="regions"></div>
</div>
<!-- js -->
<script type="module" src="pokehome-home.js"></script>
</body>

</html>
